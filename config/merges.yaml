# Merge recipes for the CoC Upgrade Planner.
# Keys are clash-of-clans-data item ids (file names under data/home/defenses).
# Unlock TH, counts per TH, and required source levels are derived from the
# data package — only the recipe (which sources combine) lives here.
# Recipes were derived from availablePerTownHall counts vs countAfterMerges
# (data package v0.19.1, Nov 2026). The sync validation re-checks them.

merges:
  ricochet-cannon:
    dataId: 1000085
    sources:
      - { id: cannon, qty: 2 }

  multi-archer-tower:
    dataId: 1000084
    sources:
      - { id: archer-tower, qty: 2 }

  multi-gear-tower:
    dataId: 1000079
    sources:
      - { id: cannon, qty: 1 }
      - { id: archer-tower, qty: 1 }

  super-wizard-tower:
    dataId: 1000102
    sources:
      - { id: wizard-tower, qty: 2 }
