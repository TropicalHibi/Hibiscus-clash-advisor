# Daily game-data update (SPEC §9b). Keeps the game data on the live site current without a local machine:
#   ClashKing static data (the game data, pinned in data/clashking/) and clash-of-clans-data (item images,
#   TH weapons, backup source). No secrets: it talks to GitHub (ClashKing's releases; the workflow's own token
#   only for rate limits, never printed), the npm registry and this repo (never `npm run meta`).
#   nothing new               → exits successfully, nothing else happens (unless new item images were found)
#   new + everything passes   → commits data/clashking/, package.json, package-lock.json, public/data-changes.json
#                               to main, then starts the Pages workflow (a GITHUB_TOKEN push alone wouldn't trigger it)
#   new item images           → every run looks up icons for items clash-of-clans-data has no picture for
#                               (ClashKing assets → Fandom wiki), saves them in public/item-images-extra/ and
#                               commits + deploys them the same way, with or without a data update
#   anything fails            → commits nothing (the known-good copy stays); opens or updates the issue
#                               "Data update failed: <version>"
name: Daily game-data update

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write # push the data commit
  issues: write # report failures
  actions: write # start the Pages workflow

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The write token is not kept in .git/config while npm code runs; only the push step uses it (git-auth.sh).
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No dependency install scripts: nothing here needs a compiled binary (esbuild / sharp ship prebuilt).
      - id: install
        run: npm ci --ignore-scripts

      # Same code path as a local `npm run sync`: clash-of-clans-data (newest in the major, known-good restore),
      # then ClashKing (latest clashy.go release at its commit; validated before it replaces the pinned copy,
      # otherwise the previous copy stays), snapshot before + after, diff → public/data-changes.json, and the
      # cross-check report (in the step summary). Unattended, a merge the recipes don't explain also fails.
      - id: check
        name: Check ClashKing and npm, update the game data
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/data-update.ts check --out "$RUNNER_TEMP/data-update.json"

      # Item images for new items (SPEC §13): an item clash-of-clans-data has no picture for gets one from
      # assets.clashk.ing, else the Fandom wiki's MediaWiki API, resized to 96 px WebP in public/item-images-extra/
      # (sources.json records where each came from; a saved image is never downloaded again). Runs on every run,
      # since a picture can appear upstream after the data did, and never fails the job (name only instead).
      - id: images
        name: Item images for new items
        run: npx tsx scripts/data-update.ts images --check "$RUNNER_TEMP/data-update.json"

      # Rule + validation tests (npm run test:ci): facts about the previous data (tests/current-data.test.ts)
      # are not run, so a new ClashKing level or TH never blocks the update.
      - id: test
        name: Tests on the new data
        if: steps.check.outputs.status == 'updated' || (steps.images.outputs.added || '0') != '0'
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee "$RUNNER_TEMP/test.log"

      - id: commit
        name: Commit and push the data update
        if: steps.check.outputs.status == 'updated' || (steps.images.outputs.added || '0') != '0'
        env:
          MESSAGE: ${{ steps.images.outputs.message || steps.check.outputs.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/data-changes.json data/clashking/ public/item-images-extra/
          git commit -m "$MESSAGE"
          bash .github/scripts/git-auth.sh pull --rebase origin main
          bash .github/scripts/git-auth.sh push origin HEAD:main

      # Pushes made with GITHUB_TOKEN don't trigger other workflows; a workflow_dispatch does.
      - id: deploy
        name: Deploy (start the Pages workflow on main)
        if: steps.check.outputs.status == 'updated' || (steps.images.outputs.added || '0') != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL: ${{ steps.install.outcome }}
          CHECK: ${{ steps.check.outcome }}
          TEST: ${{ steps.test.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          committed=""
          if [ "$INSTALL" = failure ]; then step="npm ci"
          elif [ "$CHECK" = failure ]; then step=""   # the result file names the step
          elif [ "$TEST" = failure ]; then step="tests on the new data"
          elif [ "$COMMIT" = failure ]; then step="commit and push"
          elif [ "$DEPLOY" = failure ]; then step="start the Pages workflow"; committed="--committed"
          else step="unknown step"; fi
          if ! npx tsx scripts/data-update.ts issue --result "$RUNNER_TEMP/data-update.json" ${step:+--step "$step"} \
               --test-log "$RUNNER_TEMP/test.log" --run-url "$RUN_URL" $committed \
               --title-out "$RUNNER_TEMP/title.txt" --body-out "$RUNNER_TEMP/body.md"; then
            echo "Data update failed: npm check" > "$RUNNER_TEMP/title.txt"
            printf 'The daily game-data update failed at **%s**. Nothing was committed.\n\nRun: %s\n' "${step:-unknown step}" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          fi
          # One issue per version: update the open one instead of opening a duplicate.
          bash .github/scripts/upsert-issue.sh "$(cat "$RUNNER_TEMP/title.txt")" "$RUNNER_TEMP/body.md" "Failed again: $RUN_URL"
