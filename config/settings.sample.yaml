# Default settings for the CoC Upgrade Planner.
# The UI loads these on first run; edits made in the UI are saved to
# localStorage. Delete local data in the UI to reset to this file.

goldPass: none            # none | max
simulateHelpers: true     # apply Builder's Apprentice / Lab Assistant and active boosts from the export

heroOrder:                # heroes tier order; the Archer Queen is always first (locked: her Tier 0 rule)
  - archer-queen
  - grand-warden
  - dragon-duke
  - barbarian-king
  - royal-champion
  - minion-prince

forecast:
  windowHours: 24


lab:
  pinned: []              # item ids pinned to the top of the lab queue
  kindWeights:            # lab pick: (score ÷ top score of its kind in Legend I) × weight
    troop: 1.0
    spell: 0.7
    siege: 0.5
petHouse:
  pinned: []
blacksmith:
  pinned: []

meta:
  leagueTierId: 105000036 # Legend League I
  maxPlayers: 1000
  windowDays: 14
  halfLifeDays: 5
  requestsPerSecond: 10
