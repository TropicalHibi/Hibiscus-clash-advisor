# Optional merge-recipe overrides (SPEC §7, §12). Normally EMPTY: ClashKing's data carries every merge
# (level-1 `merge_requirement` of the merged defense, with the exact source levels).
# An entry here wins over the data, e.g. if ClashKing ships a new merged defense with a wrong or missing
# requirement. Keys are item ids (slug of the name, e.g. "super-wizard-tower"); `level` is optional
# (default: the source's max level at the merge's unlock TH).
#
# merges:
#   super-wizard-tower:
#     dataId: 1000102
#     sources:
#       - { id: wizard-tower, qty: 2, level: 17 }
merges: {}
