# Super troop dataIds → base troop (hand-maintained).
# clash-of-clans-data lists super troops inside their base troop's file but without a dataId,
# so army share codes can't be resolved for them from the data package alone.
# A super troop's level is its base troop's level, so the planner credits super troop usage
# to the base troop's lab upgrade. `base` is the clash-of-clans-data file id.
# IDs are checked against the API's troop order by tests/meta.test.ts ("IDs agree with the order of /players/{tag} troops").
